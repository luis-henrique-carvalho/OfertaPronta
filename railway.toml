# ==============================================================================
# Configuração Railway (Config as Code / IaC) — OfertaPronta
# ==============================================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Variáveis padrão injetadas no ambiente do container
[deploy.env]
NODE_ENV = "production"
PORT = "3000"
DEV_BYPASS_PAYMENT = "false"
COBRANDING_PROMOTION_ENABLED = "true"
PUSHIN_PAY_BASE_URL = "https://api.pushinpay.com.br"
