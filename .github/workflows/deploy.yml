name: CI/CD & Deploy to Railway

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test & Build Quality Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ofertapronta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Prepare Test Database
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/ofertapronta_test
        run: pnpm db:push

      - name: Run Vitest Unit & Integration Tests
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/ofertapronta_test
        run: pnpm test

      - name: Test Production Build
        run: pnpm build

  deploy:
    name: Deploy to Railway
    needs: [verify]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE || 'ofertapronta' }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning ::RAILWAY_TOKEN secret not configured in GitHub Secrets. Skipping automatic deployment."
            exit 0
          fi
          railway up --service "${RAILWAY_SERVICE:-ofertapronta}" --ci -m "Deploy commit ${{ github.sha }} via GitHub Actions"
