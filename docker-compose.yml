services:
  postgres:
    image: postgres:17-alpine
    container_name: ofertapronta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ofertapronta
    ports:
      - "5433:5432"
    volumes:
      - ofertapronta_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ofertapronta"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ofertapronta_pgdata:
    name: ofertapronta_pgdata
